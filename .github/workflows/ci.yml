name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-checks:
    name: Python 3.10 software checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record resolved dependency versions
        run: |
          python -m pip list --format=freeze
          python -m pip install --dry-run ".[all,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests examples

      - name: Run software-only tests
        run: python -m pytest -q

      - name: Run no-hardware Quick Start
        run: python examples/mock_quickstart.py

      - name: Build wheel and source distribution
        # Verbose build output records the versions installed in the isolated
        # build environment, including setuptools and wheel.
        run: python -m build --verbose

      - name: Verify wheel installation and import
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import tron2_env; print(tron2_env.__file__)"
